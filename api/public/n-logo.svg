<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#2D1F54"/>
      <stop offset="45%" stop-color="#120B1C"/>
      <stop offset="100%" stop-color="#050308"/>
    </radialGradient>
    
    <!-- Face Gradients -->
    <linearGradient id="top-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#DDD3FF" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="left-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0055FF"/>
    </linearGradient>

    <linearGradient id="right-grad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#7000FF"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#8B5CF6" flood-opacity="0.45"/>
    </filter>

    <!-- Definition of a single isometric voxel cube -->
    <g id="voxel-cube">
      <!-- Left Face -->
      <path d="M -56 0 L 0 32 L 0 96 L -56 64 Z" fill="url(#left-grad)"/>
      <!-- Right Face -->
      <path d="M 0 32 L 56 0 L 56 64 L 0 96 Z" fill="url(#right-grad)"/>
      <!-- Top Face -->
      <path d="M 0 -32 L 56 0 L 0 32 L -56 0 Z" fill="url(#top-grad)"/>
      <!-- Inner highlighting lines for 3D bevel look -->
      <path d="M -56 0 L 0 32 L 56 0" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>
      <path d="M 0 32 L 0 96" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.2" fill="none"/>
    </g>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#2E1C4E" stroke-width="2"/>

  <!-- Logo Group -->
  <g filter="url(#neon-glow)">
    <!-- Let's render the voxel 'N' using the 7 cubes, back-to-front rendering for proper overlapping -->
    <!-- Left Top -->
    <use href="#voxel-cube" x="200" y="160"/>
    <!-- Right Top -->
    <use href="#voxel-cube" x="312" y="160"/>
    <!-- Left Middle -->
    <use href="#voxel-cube" x="200" y="224"/>
    <!-- Right Middle -->
    <use href="#voxel-cube" x="312" y="224"/>
    <!-- Diagonal Middle -->
    <use href="#voxel-cube" x="256" y="256"/>
    <!-- Left Bottom -->
    <use href="#voxel-cube" x="200" y="288"/>
    <!-- Right Bottom -->
    <use href="#voxel-cube" x="312" y="288"/>
  </g>
</svg>
